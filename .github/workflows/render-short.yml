name: Render OBNOTE Shorts template

on:
  workflow_dispatch:
    inputs:
      product_code:
        description: "Published product code to render (demo code: 1001)"
        type: string
        required: true
        default: "1001"
  push:
    branches: [main]
    paths:
      - .github/workflows/render-short.yml

permissions:
  contents: read

jobs:
  render-short:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned rendering dependency
        run: python -m pip install pillow==11.3.0 imageio-ffmpeg==0.6.0
      - name: Check bundled FFmpeg
        run: python -c "from imageio_ffmpeg import get_ffmpeg_exe; print(get_ffmpeg_exe())"
      - name: Install offline English speech synthesizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
      - name: Generate original narration and subtitles
        env:
          OBNOTE_SUPABASE_PUBLIC_KEY: sb_publishable_pDN2aE-XfuHPvqvI96_QFw_MAiujlJJ
          CODE: ${{ inputs.product_code || '1001' }}
        run: python3 scripts/generate_short_script.py --code "$CODE"
      - name: Render vertical video with embedded scene captions
        env:
          OBNOTE_SUPABASE_PUBLIC_KEY: sb_publishable_pDN2aE-XfuHPvqvI96_QFw_MAiujlJJ
          CODE: ${{ inputs.product_code || '1001' }}
        run: |
          python3 scripts/render_short.py --code "$CODE" \
            --storyboard "dist/obnote-${CODE}-script.json" \
            --out "dist/obnote-${CODE}-silent.mp4"
      - name: Synthesize offline English voiceover and final MP4
        env:
          CODE: ${{ inputs.product_code || '1001' }}
        run: |
          python3 scripts/synthesize_short.py \
            --storyboard "dist/obnote-${CODE}-script.json" \
            --video "dist/obnote-${CODE}-silent.mp4" \
            --output "dist/obnote-${CODE}-short.mp4"
      - name: Summarize generated files
        env:
          CODE: ${{ inputs.product_code || '1001' }}
        run: |
          printf '## OBNOTE Shorts preview\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Product: %s\n\n' "$CODE" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- MP4 with captions and offline speech\n- MP4 without voice\n- JSON narration plan\n- SRT subtitle file\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'All files are private workflow artifacts (not published to YouTube).\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload generated Shorts video
        uses: actions/upload-artifact@v4
        with:
          name: obnote-shorts-preview
          path: |
            dist/*.mp4
            dist/*.json
            dist/*.srt
          retention-days: 7
          if-no-files-found: error
