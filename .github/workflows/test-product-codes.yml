name: Test OBNOTE product codes

on:
  push:
    branches:
      - main
    paths:
      - "scripts/add_product.py"
      - "scripts/manage_products.py"
      - "tests/test_add_product.py"
      - "tests/test_manage_products.py"
      - ".github/workflows/test-product-codes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test code allocation without changing real products
        run: python3 -m unittest discover -s tests -v
