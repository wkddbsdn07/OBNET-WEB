name: Audit OBNOTE price and stock reviews

on:
  schedule:
    # Daily 09:07 Korea Standard Time.
    - cron: "7 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_catalog.py
      - .github/workflows/audit-catalog.yml

permissions:
  contents: read

jobs:
  audit-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check freshness of published product records
        env:
          OBNOTE_SUPABASE_PUBLIC_KEY: sb_publishable_pDN2aE-XfuHPvqvI96_QFw_MAiujlJJ
        run: python3 scripts/audit_catalog.py
