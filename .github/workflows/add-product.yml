name: Add OBNOTE product

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Product name"
        type: string
        required: true
      category:
        description: "Product category"
        type: choice
        options:
          - DESK TECH
          - IT & GADGETS
          - DESK ACCESSORIES
          - WORKSPACE
        default: DESK TECH
        required: true
      tagline:
        description: "Short tagline"
        type: string
        required: false
      description:
        description: "Description"
        type: string
        required: true
      features:
        description: "Features separated by |"
        type: string
        required: false
      image_url:
        description: "Authorized HTTPS image URL"
        type: string
        required: false
      price:
        description: "Price, blank for unknown"
        type: string
        required: false
      currency:
        description: "Currency"
        type: choice
        options:
          - USD
          - KRW
          - EUR
        default: USD
      purchase_url:
        description: "Approved HTTPS seller URL"
        type: string
        required: false
      stock_status:
        description: "Seller-reported availability (unknown if unverified)"
        type: choice
        options: [unknown, in_stock, out_of_stock, preorder]
        default: unknown
      is_demo:
        description: "Demo product? (no price or purchase link)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: obnote-product-admin
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add product to Supabase with automatically assigned code
        env:
          OBNOTE_SUPABASE_SECRET_KEY: ${{ secrets.OBNOTE_SUPABASE_SECRET_KEY }}
          PRODUCT_NAME: ${{ inputs.name }}
          PRODUCT_CATEGORY: ${{ inputs.category }}
          PRODUCT_TAGLINE: ${{ inputs.tagline }}
          PRODUCT_DESCRIPTION: ${{ inputs.description }}
          PRODUCT_FEATURES: ${{ inputs.features }}
          PRODUCT_IMAGE_URL: ${{ inputs.image_url }}
          PRODUCT_PRICE: ${{ inputs.price }}
          PRODUCT_CURRENCY: ${{ inputs.currency }}
          PRODUCT_PURCHASE_URL: ${{ inputs.purchase_url }}
          PRODUCT_IS_DEMO: ${{ inputs.is_demo }}
          PRODUCT_STOCK_STATUS: ${{ inputs.stock_status }}
        run: python3 scripts/manage_products.py add
